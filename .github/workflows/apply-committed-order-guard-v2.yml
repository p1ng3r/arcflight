name: Apply committed-order guard v2

on:
  push:
    branches:
      - fix/travel-v2-baseline-repairs-v2

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch helper and focused smoke
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper_path = Path("scripts/helpers/travel-v2-round-action-order-state.js")
          helper = helper_path.read_text(encoding="utf-8")
          start = helper.index("export function commitTravelV2RoundActionOrderToSession")
          end = helper.index("\nexport function unlockTravelV2RoundActionOrderInSession", start)
          segment = helper[start:end]
          marker = '\n  const timestamp = typeof options.timestamp === "string" && options.timestamp.trim() ? options.timestamp.trim() : new Date().toISOString();'
          if segment.count(marker) != 1:
              raise RuntimeError("commit timestamp marker mismatch")
          guard = '''
  const existingValidation = normalizeTravelV2ProposedRoundActionOrder(existingOrder, activeStations);
  if (existingRecord && existingValidation.valid) {
    const reason = "Committed round action order must be unlocked before it can be replaced.";
    return deepFreeze({ ok: false, committed: false, duplicate: false, blocked: true, playerSafe: !isGm, blockedReasons: [reason], reason, roundIndex, roundNumber, previousOrder, committedOrder, session: isGm ? cloneData(session) : null });
  }
'''
          segment = segment.replace(marker, guard + marker)
          helper_path.write_text(helper[:start] + segment + helper[end:], encoding="utf-8")

          smoke_path = Path("scripts/helpers/travel-v2-round-action-order-state.smoke.js")
          smoke = smoke_path.read_text(encoding="utf-8")
          marker = '  checked.push("duplicate commit is non-destructive and does not append audit records");\n'
          if smoke.count(marker) != 1:
              raise RuntimeError("smoke insertion marker mismatch")
          coverage = '''
  const replacementWithoutUnlock = commitTravelV2RoundActionOrderToSession(committed.session, ["navigator", "engineer", "watchmaster"], { user: { isGM: true }, commitRequested: true, timestamp: "2026-07-03T00:02:00.000Z" });
  assert.equal(replacementWithoutUnlock.ok, false);
  assert.equal(replacementWithoutUnlock.blocked, true);
  assert.equal(replacementWithoutUnlock.committed, false);
  assert.match(replacementWithoutUnlock.reason, /must be unlocked/);
  assert.deepEqual(replacementWithoutUnlock.session.travelV2RoundActionOrder.rounds["0"].order, ["engineer", "navigator", "watchmaster"]);
  assert.equal(replacementWithoutUnlock.session.travelV2RoundActionOrder.commitRecords.length, 1);
  checked.push("committed order replacement requires explicit unlock");
'''
          smoke_path.write_text(smoke.replace(marker, marker + coverage), encoding="utf-8")
          PY

          rm .github/workflows/apply-committed-order-guard-v2.yml

      - name: Commit lifecycle guard
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/helpers/travel-v2-round-action-order-state.js scripts/helpers/travel-v2-round-action-order-state.smoke.js .github/workflows/apply-committed-order-guard-v2.yml
          git commit -m "fix: require unlock before replacing committed order"
          git push
