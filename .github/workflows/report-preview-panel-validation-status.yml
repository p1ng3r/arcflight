name: Report preview-panel validation status

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run and publish checks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e

          node scripts/dev/run-travel-v2-smoke.mjs > /tmp/travel.log 2>&1
          travel_status=$?
          if [ "$travel_status" = "0" ]; then
            travel_context="travel-v2-smoke"
            travel_state=success
          else
            message=$(tail -n 1 /tmp/travel.log | tr -cd '[:alnum:] _.-' | cut -c1-75)
            travel_context="travel-v2-smoke/$message"
            travel_state=failure
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$travel_state" -f context="$travel_context"

          node scripts/dev/run-foundry-check-runner-smoke.mjs > /tmp/foundry.log 2>&1
          foundry_status=$?
          if [ "$foundry_status" = "0" ]; then foundry_state=success; else foundry_state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$foundry_state" -f context="foundry-check-runner-smoke"

          git diff --check > /tmp/diff.log 2>&1
          diff_status=$?
          if [ "$diff_status" = "0" ]; then diff_state=success; else diff_state=failure; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$diff_state" -f context="git-diff-check"

          rm .github/workflows/report-preview-panel-validation-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/report-preview-panel-validation-status.yml
          git commit -m "chore: remove temporary status workflow"
          git push
