name: Arcflight Smoke CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arcflight-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check whitespace in changed files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}:${GITHUB_BASE_REF}"
            git diff --check "${GITHUB_BASE_REF}...HEAD"
            exit 0
          fi

          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            git diff --check HEAD~1..HEAD
          else
            git diff --check HEAD
          fi

      - name: Travel v2 smoke
        run: node scripts/dev/run-travel-v2-smoke.mjs

      - name: Foundry check runner smoke
        run: node scripts/dev/run-foundry-check-runner-smoke.mjs
