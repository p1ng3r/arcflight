name: Capture keyboard assertion details

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture structured assertion
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { runTravelEventRunnerV2RoundActionOrderKeyboardReorderSmokeChecks } from "./scripts/apps/travel-event-runner-v2-round-action-order-keyboard-reorder.smoke.js";
          const report = {};
          try {
            await runTravelEventRunnerV2RoundActionOrderKeyboardReorderSmokeChecks();
            report.passed = true;
          } catch (error) {
            report.passed = false;
            report.name = error?.name;
            report.message = error?.message;
            report.operator = error?.operator;
            report.actual = error?.actual;
            report.expected = error?.expected;
            if (typeof error?.actual === "string" && typeof error?.expected === "string") {
              try {
                const actual = JSON.parse(error.actual);
                const expected = JSON.parse(error.expected);
                const keys = Array.from(new Set([...Object.keys(actual ?? {}), ...Object.keys(expected ?? {})]));
                report.changedTopLevelKeys = keys.filter((key) => JSON.stringify(actual?.[key]) !== JSON.stringify(expected?.[key]));
                report.actualChangedValues = Object.fromEntries(report.changedTopLevelKeys.map((key) => [key, actual?.[key]]));
                report.expectedChangedValues = Object.fromEntries(report.changedTopLevelKeys.map((key) => [key, expected?.[key]]));
              } catch {}
            }
          }
          fs.writeFileSync("docs/KEYBOARD_REORDER_ASSERTION_DIAGNOSTIC.json", JSON.stringify(report, null, 2));
          NODE
          rm .github/workflows/capture-keyboard-assertion-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/KEYBOARD_REORDER_ASSERTION_DIAGNOSTIC.json .github/workflows/capture-keyboard-assertion-details.yml
          git commit -m "chore: capture keyboard assertion diagnostic"
          git push
