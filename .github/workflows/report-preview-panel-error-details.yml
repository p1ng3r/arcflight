name: Report preview-panel error details

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Capture assertion text
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/dev/run-travel-v2-smoke.mjs > /tmp/travel.log 2>&1
          line=$(tail -n 1 /tmp/travel.log)
          message=${line#Travel v2 GM preview panel smoke check failed: }
          clean=$(printf '%s' "$message" | tr -cd '[:alnum:] _.,:-')
          for index in 1 2 3; do
            start=$(( (index - 1) * 70 + 1 ))
            chunk=$(printf '%s' "$clean" | cut -c${start}-$((start + 69)))
            [ -n "$chunk" ] || chunk="end"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context="travel-error-$index/$chunk"
          done
          rm .github/workflows/report-preview-panel-error-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/report-preview-panel-error-details.yml
          git commit -m "chore: remove temporary error-report workflow"
          git push
