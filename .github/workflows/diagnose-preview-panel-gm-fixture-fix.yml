name: Diagnose preview-panel GM fixture fix

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture validation output
        shell: bash
        run: |
          set +e
          log=.preview-panel-gm-fixture-validation.log
          {
            echo "=== Travel v2 smoke ==="
            node scripts/dev/run-travel-v2-smoke.mjs
            echo "travel_status=$?"
            echo
            echo "=== Foundry check runner smoke ==="
            node scripts/dev/run-foundry-check-runner-smoke.mjs
            echo "foundry_status=$?"
            echo
            echo "=== git diff --check ==="
            git diff --check
            echo "diff_status=$?"
          } > "$log" 2>&1
          rm .github/workflows/diagnose-preview-panel-gm-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$log" .github/workflows/diagnose-preview-panel-gm-fixture-fix.yml
          git commit -m "chore: capture baseline validation diagnostics"
          git push
