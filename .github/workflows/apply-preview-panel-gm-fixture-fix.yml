name: Apply preview-panel GM fixture fix

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact fixture correction
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = "scripts/apps/travel-event-runner-v2-preview-panel.smoke.js";
          const before = '  const appState = prepareTravelEventRunnerAppStateWithTravelV2Preview({ session: { event: createRunnerEventFixture() } });';
          const after = '  const appState = prepareTravelEventRunnerAppStateWithTravelV2Preview({ session: { event: createRunnerEventFixture() }, user: { isGM: true, id: "gm", name: "GM" } });';
          const source = fs.readFileSync(path, "utf8");
          const matches = source.split(before).length - 1;
          if (matches !== 1) throw new Error(`Expected exactly one baseline fixture match, found ${matches}.`);
          fs.writeFileSync(path, source.replace(before, after));
          NODE
          rm .github/workflows/apply-preview-panel-gm-fixture-fix.yml

      - name: Commit fixture correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/apps/travel-event-runner-v2-preview-panel.smoke.js .github/workflows/apply-preview-panel-gm-fixture-fix.yml
          git commit -m "test: provide GM identity to preview panel smoke"
          git push
