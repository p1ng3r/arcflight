name: Report next Travel v2 failure

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report last non-empty output
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/dev/run-travel-v2-smoke.mjs > /tmp/travel.log 2>&1
          line=$(grep -v '^[[:space:]]*$' /tmp/travel.log | tail -n 1)
          clean=$(printf '%s' "$line" | tr -cd '[:alnum:] _.,:()/-')
          for index in 1 2 3 4; do
            start=$(( (index - 1) * 65 + 1 ))
            chunk=$(printf '%s' "$clean" | cut -c${start}-$((start + 64)))
            [ -n "$chunk" ] || chunk="end"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context="next-error-$index/$chunk"
          done
          previous=$(grep -v '^[[:space:]]*$' /tmp/travel.log | tail -n 2 | head -n 1 | tr -cd '[:alnum:] _.,:()/-' | cut -c1-80)
          [ -n "$previous" ] || previous="none"
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context="previous-output/$previous"
          rm .github/workflows/report-next-travel-v2-failure.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/report-next-travel-v2-failure.yml
          git commit -m "chore: remove temporary next-error reporter"
          git push
