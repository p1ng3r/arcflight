name: Report reorder blocked reason

on:
  push:
    branches:
      - fix/travel-v2-preview-panel-gm-fixture

permissions:
  contents: write
  statuses: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report full actual value
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node scripts/dev/run-travel-v2-smoke.mjs > /tmp/travel.log 2>&1
          line=$(tail -n 1 /tmp/travel.log)
          clean=$(printf '%s' "$line" | tr -cd '[:alnum:] _.,:-')
          for index in 1 2 3 4 5; do
            start=$(( (index - 1) * 60 + 1 ))
            chunk=$(printf '%s' "$clean" | cut -c${start}-$((start + 59)))
            [ -n "$chunk" ] || chunk="end"
            gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=failure -f context="blocked-reason-$index/$chunk"
          done
          rm .github/workflows/report-reorder-blocked-reason.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/report-reorder-blocked-reason.yml
          git commit -m "chore: remove temporary blocked-reason report"
          git push
